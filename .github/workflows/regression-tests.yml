name: Regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fonts:
    name: FreeType fonts and DPI (ASan and UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install font test dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfreetype-dev fonts-dejavu-core
      - name: Check production font loading and dynamic DPI rasterization
        run: python3 tests/font_rendering/run.py
  transport:
    name: J-Link transport (ASan and UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run regression tests
        run: sh tests/run_transport_tests.sh
  ui:
    name: XML and widget safety (ASan and UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile and run headless UI regression tests
        run: python3 tests/ui_regression/run.py
  widgets:
    name: Every widget with real ImGui (ASan and UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load and draw every widget with missing and hostile properties
        run: python3 tests/widget_smoke/run.py
