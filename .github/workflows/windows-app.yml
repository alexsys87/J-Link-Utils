name: Windows application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: ${{ matrix.arch }} Release executable (static CRT)
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.dependencies\binary-cache
    steps:
      - uses: actions/checkout@v6
      - name: Prepare binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache/restore@v4
        id: restore-cache
        with:
          path: .dependencies/binary-cache
          key: windows-2022-v143-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'build/dependencies/host-tools/vcpkg.json', 'build/dependencies/vcpkg-lock.json', 'scripts/*Dependency*.ps1', 'scripts/Build-WindowsDependencies.ps1') }}
          restore-keys: windows-2022-v143-${{ matrix.arch }}-
      - name: Build dependencies, validate probes, compile and package full application
        shell: pwsh
        run: ./scripts/Build-WindowsApp.ps1 -Architecture ${{ matrix.arch }} -PlatformToolset v143
      - name: Verify executable handles the absent proprietary DLL
        shell: pwsh
        run: |
          # This runner has no SEGGER DLL. Validate startup/load-error handling,
          # not GUI, device connectivity, or hardware behavior.
          $process = Start-Process -FilePath './out/app/${{ matrix.arch }}/Release/J-Link Utils.exe' -ArgumentList '--check-jlink-runtime' -Wait -PassThru
          if ($process.ExitCode -ne 2) { throw "Expected missing-runtime exit 2; got $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: J-Link-Utils-${{ matrix.arch }}-Release
          path: out/package/J-Link-Utils-${{ matrix.arch }}-Release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: windows-app-build-log-${{ matrix.arch }}
          path: out/app/${{ matrix.arch }}/Release/build.binlog
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ always() && steps.restore-cache.outcome == 'success' && steps.restore-cache.outputs.cache-hit != 'true' }}
        with:
          path: .dependencies/binary-cache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
